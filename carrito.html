<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Mueblería Hermanos Jota</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
   
    <header class="site-header">
        <div class="container header__inner">

            <a href="index.html" class="logo" aria-label="Hermanos Jota, ir al inicio">
                <img src="assets/images/logo.svg" alt="" class="logo__img">
                <span class="logo__text">Hermanos Jota</span>
            </a>

            <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="nav-menu">
                <span class="nav-toggle__bar"></span>
                <span class="nav-toggle__bar"></span>
                <span class="nav-toggle__bar"></span>
            </button>

            <nav class="main-nav" id="nav-menu" aria-label="Navegación principal">
                <ul class="main-nav__list">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>

            <a href="carrito.html" class="cart-link" aria-label="Ver carrito de compras" aria-current="page">
                <svg class="cart-link__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M6 6h15l-1.5 9h-12L6 3H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="9.5" cy="19.5" r="1.4" fill="currentColor"/>
                    <circle cx="17.5" cy="19.5" r="1.4" fill="currentColor"/>
                </svg>
                <span class="cart-link__count" id="cart-count" hidden>0</span>
            </a>

        </div>
    </header>

    <!-- ===================== CONTENIDO PRINCIPAL ===================== -->
    <main class="pagina-carrito">
        <div class="contenedor-carrito">
            <h1 class="titulo-carrito">Tu Carrito de Compras</h1>

           
            <div id="carrito-vacio" class="mensaje-carrito-vacio" hidden>
                <h2>Tu carrito está vacío actualmente.</h2>
                <a href="productos.html" class="btn-catalogo">Ver Catálogo de Productos</a>
            </div>

            <div id="contenido-carrito" class="layout-carrito" hidden>
                <section class="lista-elementos-carrito" id="lista-elementos-carrito">
                    <!-- Los productos se renderizan dinámicamente desde carrito.js -->
                </section>

                <aside class="resumen-pedido">
                    <h2>Resumen del Pedido</h2>
                    
                    <div class="fila-resumen">
                        <span>Subtotal</span>
                        <span id="subtotal-carrito">$0</span>
                    </div>

                    <div class="fila-resumen">
                        <span>IVA (21%)</span>
                        <span id="impuesto-carrito">$0</span>
                    </div>

                    <div class="fila-resumen total-resumen">
                        <span>Total</span>
                        <span id="total-carrito">$0</span>
                    </div>

                    <div class="grupo-botones-carrito">
                        <button id="btn-comprar" type="button" class="btn-comprar">Finalizar Compra</button>
                        <button id="btn-vaciar" type="button" class="btn-vaciar">Vaciar Carrito</button>
                    </div>
                    <!-- Ventana Emergente de Confirmación -->

                </aside>
            </div>
        </div>
    </main>

    <!-- Scripts del sitio -->
    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
